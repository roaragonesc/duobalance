name: Publish mock demo to GitHub Pages

on:
  push:
    branches: [ro-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix test-framework ci
      - run: npm run lint
      - run: npm --prefix test-framework exec -- playwright install --with-deps chromium
      - run: npm run test:unit -- --workers=1
      - run: npm run build:demo
      - run: npm --prefix test-framework run test:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-demo-test-results
          path: test-results/pages-demo
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
